<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タスク">
<meta name="theme-color" content="#0E1A22">
<title>タスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   藍（あい）— 優先度は藍染の色階で表す。
   甕覗き → 浅葱 → 縹 → 紺 → 留紺。濃いほど重い。
   期限超過は「赤く怒る」のではなく「藍が濃くなる」だけにする。
   ページ上の暖色（山吹）は「次の一手」にしか使わない。
   ============================================================ */
:root{
  --paper:#EDEFF0; --card:#FFFFFF; --sunk:#F4F6F6;
  --ink:#12222E; --ink-2:#55697A; --ink-3:#8598A5;
  --rule:#DBE2E5; --rule-soft:#E9EEEF;
  --dye-1:#16304F; --dye-2:#2A5488; --dye-3:#4E86AE; --dye-4:#A3C4CE;
  --warm:#9C6410; --warm-ink:#7A4E0B; --warm-bg:#FCF3E2; --warm-line:#E9D6AC;
  --focus:#2A5488;
  --font-jp:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1A22; --card:#152531; --sunk:#111F29;
    --ink:#E4ECF0; --ink-2:#9BAEBB; --ink-3:#6D8290;
    --rule:#233743; --rule-soft:#1B2C37;
    --dye-1:#79B0E6; --dye-2:#5386BA; --dye-3:#3C6389; --dye-4:#2C4557;
    --warm:#E0A94A; --warm-ink:#EDBD68; --warm-bg:#26200F; --warm-line:#3F3319;
    --focus:#79B0E6;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-jp); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hide{display:none !important}

.wrap{max-width:680px;margin:0 auto;padding:0 18px 140px}

/* ---------- 見出し ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding-top:calc(16px + env(safe-area-inset-top));
  border-bottom:1px solid var(--rule);
}
.hrow{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.brand{
  font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--ink-3);
  writing-mode:horizontal-tb;padding-bottom:5px;
}
.today{font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.2;margin-left:auto}
.today .dow{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:5px}

/* 流量。ゲームの得点ではなく、業務の処理量として読ませる */
/* ヘッダーの数字。ラベルの長さがまちまちなので、幅を揃えて等間隔に置く */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px;max-width:420px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:17px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.stat .k{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:500}
.stat.up .v{color:var(--dye-2)}
.stat.warn .v{color:var(--dye-1)}
/* 押せる数字。押せることが分かるだけの最小の合図にする */
.stat.click{text-align:left;padding:2px 8px 2px 0;border-radius:6px;transition:.12s}
.stat.click:hover{background:var(--sunk)}
.stat.click:hover .k{color:var(--ink-2)}

.tabs{display:flex;gap:26px}
.tabs button{
  padding:0 0 11px;font-size:13.5px;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;
}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--dye-2);font-weight:700}
.tabs .n{font-size:11px;margin-left:5px;color:var(--ink-3)}
.tabs button.on .n{color:var(--dye-2)}

/* 仕事／私用の切り替え。タブとは別の軸なので、見た目もタブと変える（右端の小さな箱） */
.areasw{display:flex;margin-left:auto;align-self:center;margin-bottom:9px;
  border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.areasw button{padding:3px 9px;font-size:11px;font-weight:500;color:var(--ink-3);
  border:0;border-bottom:0;margin:0;background:transparent;transition:background .15s,color .15s}
.areasw button+button{border-left:1px solid var(--rule)}
.areasw button:hover{color:var(--ink-2)}
.areasw button.on{color:var(--ink);background:var(--sunk);font-weight:700}
@media(max-width:520px){ .areasw{margin-left:12px} }

/* ---------- 区切り ---------- */
.sec{
  display:flex;align-items:baseline;gap:10px;
  margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule-soft);
}
.sec .t{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-2)}
.sec .c{font-size:11px;color:var(--ink-3)}
.sec.click{cursor:pointer;user-select:none;width:100%;text-align:left}
.sec .caret{margin-left:auto;color:var(--ink-3);font-size:10px;transition:transform .18s}
.sec.closed .caret{transform:rotate(-90deg)}

/* ---------- タスク ---------- */
.task{
  position:relative;background:var(--card);border:1px solid var(--rule);
  border-radius:10px;padding:13px 14px 13px 17px;margin-bottom:9px;
  display:flex;gap:13px;align-items:flex-start;overflow:hidden;
  transition:border-color .15s, opacity .26s, transform .26s;
}
/* 藍の帯。左の一列を見るだけで、重さの分布が分かる */
.task::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--dye);transform-origin:top;transition:opacity .26s;
}
.task.d1{--dye:var(--dye-1)} .task.d2{--dye:var(--dye-2)}
.task.d3{--dye:var(--dye-3)} .task.d4{--dye:var(--dye-4)}
.task:hover{border-color:var(--ink-3)}
.task.leaving{opacity:0;transform:translateX(10px)}
.task.leaving::before{opacity:0}

.tick{
  flex:none;width:21px;height:21px;margin-top:2px;border-radius:50%;
  border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;
  transition:border-color .14s,background .14s;
}
.tick svg{width:11px;height:11px;opacity:0;transition:opacity .14s;color:var(--card)}
.tick:hover{border-color:var(--dye-2);background:var(--dye-2)}
.tick:hover svg{opacity:1}
@media (pointer:coarse){
  .task{padding-top:15px;padding-bottom:15px}
  .tick{width:24px;height:24px;position:relative}
  .tick::after{content:"";position:absolute;inset:-10px}
}

.body{flex:1;min-width:0}
.ttl{font-size:15px;font-weight:500;line-height:1.55;letter-spacing:.005em;word-break:break-word}
.meta{
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  margin-top:7px;font-size:11px;color:var(--ink-2);letter-spacing:.02em;
}
.meta .sep{color:var(--ink-3);opacity:.5}
.proj{font-weight:700;color:var(--ink-2)}
.due.over{color:var(--dye-1);font-weight:700}
@media (prefers-color-scheme:dark){.due.over{color:var(--dye-1)}}
.wait{color:var(--ink-2)}
.pill{
  border:1px solid var(--rule);border-radius:4px;padding:0 5px;
  font-size:10.5px;color:var(--ink-2);
}
/* 私用の印。目立たせすぎない。仕事の中に紛れていても見分けがつけばよい */
.pill.priv{color:var(--dye-2);border-color:var(--dye-4);font-weight:700}
/* 更新日。ふだんは黙っていて、直近で触ったものだけが色を持つ */
.upd{color:var(--ink-3)}
.upd.fresh{color:var(--dye-2);font-weight:700}
.stamp{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;padding-top:12px;
  border-top:1px solid var(--rule-soft);
  font-size:11px;color:var(--ink-3);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}

/* 次の一手。ページ上で暖色はここだけ。目が最初にここへ行く */
.na{
  margin-top:9px;padding:8px 11px;border-radius:7px;
  background:var(--warm-bg);border:1px solid var(--warm-line);
  font-size:13.5px;line-height:1.6;color:var(--warm-ink);
  display:flex;gap:9px;align-items:flex-start;
}
.na .arrow{flex:none;color:var(--warm);font-size:10px;margin-top:4px;letter-spacing:0}
.na-empty{
  margin-top:9px;padding:6px 11px;border-radius:7px;
  border:1px dashed var(--rule);font-size:11.5px;color:var(--ink-3);
}
.resume{
  margin-top:8px;display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--dye-2);font-weight:500;
  border:1px solid var(--rule);border-radius:6px;padding:4px 9px;
  transition:border-color .14s,background .14s;
}
.resume:hover{border-color:var(--dye-2);background:var(--sunk)}

/* ---------- 空・完了 ---------- */
.empty{
  border:1px dashed var(--rule);border-radius:12px;
  padding:44px 22px;text-align:center;background:var(--card);
}
.empty .big{font-size:16.5px;font-weight:700;margin-bottom:7px}
.empty p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.7}
.donerow{
  display:flex;gap:12px;align-items:center;
  padding:9px 14px 9px 17px;border-bottom:1px solid var(--rule-soft);
  font-size:13.5px;color:var(--ink-3);
}
.donerow .t{text-decoration:line-through;text-decoration-color:var(--rule)}
.donerow button{margin-left:auto;flex:none;font-size:11.5px;color:var(--dye-2);padding:3px 7px}
.donerow button:hover{text-decoration:underline}

/* ---------- ボタン ---------- */
.btn{
  border:1px solid var(--rule);border-radius:8px;padding:9px 16px;
  font-size:13.5px;font-weight:500;background:var(--card);
  transition:border-color .14s,background .14s;
}
.btn:hover{border-color:var(--ink-3);background:var(--sunk)}
.btn.pri{background:var(--dye-2);border-color:var(--dye-2);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--dye-1);border-color:var(--dye-1)}
@media (prefers-color-scheme:dark){.btn.pri{color:#0E1A22}}
.btn.wide{display:block;width:100%;text-align:center}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 追加バー ---------- */
.addbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--rule);
  padding:11px 18px calc(11px + env(safe-area-inset-bottom));
}
.addbar .in{max-width:680px;margin:0 auto;display:flex;gap:9px}
.addbar input{
  flex:1;min-width:0;background:var(--sunk);border:1px solid var(--rule);
  border-radius:8px;padding:10px 13px;font-size:15px;outline:none;transition:border-color .14s;
}
.addbar input:focus{border-color:var(--dye-2);background:var(--card)}

/* ---------- シート ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,18,25,.5);z-index:40;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:16px 16px 0 0;box-shadow:0 -10px 44px rgba(9,18,25,.3);
  max-height:90vh;overflow:auto;display:none;
  padding:8px 18px calc(26px + env(safe-area-inset-bottom));
}
.sheet.on{display:block}
.grip{width:36px;height:4px;border-radius:9px;background:var(--rule);margin:7px auto 18px}
.sheet .max{max-width:680px;margin:0 auto}
.fld{margin-bottom:15px}
.fld label{
  display:block;font-size:10.5px;font-weight:700;letter-spacing:.11em;
  color:var(--ink-3);margin-bottom:6px;
}
.fld input,.fld textarea{
  width:100%;background:var(--sunk);border:1px solid var(--rule);border-radius:8px;
  padding:10px 12px;font-size:14.5px;line-height:1.6;outline:none;transition:border-color .14s;
}
.fld input:focus,.fld textarea:focus{border-color:var(--dye-2);background:var(--card)}
.fld textarea{resize:vertical;min-height:54px}
.fld .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.6}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;border:1px solid var(--rule);border-radius:8px;padding:9px 2px;
  font-size:12.5px;color:var(--ink-2);background:var(--sunk);transition:.14s;
}
.seg button:hover{border-color:var(--ink-3)}
.seg button.on{background:var(--card);border-color:var(--dye-2);color:var(--dye-2);font-weight:700}
/* 目標は名前が長いので、狭い画面では縦に積む */
@media (max-width:560px){
  .seg.goals{flex-direction:column}
  .seg.goals button{text-align:left;padding:10px 12px}
}

/* 再開プロンプト：貼り付けて使うテキストなので等幅で見せる */
/* ---------- まとめ（見取り図） ---------- */
.gcard{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:15px 16px;margin-bottom:10px;position:relative;overflow:hidden;
}
.gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dye-3)}
.ghead{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
.gcode{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
.gttl{font-size:14.5px;font-weight:700;letter-spacing:.01em}
.gwt{margin-left:auto;font-size:11px;color:var(--ink-2)}
.gwt b{font-size:15px;font-weight:700;color:var(--ink)}
.gaim{font-size:11.5px;color:var(--ink-2);line-height:1.75}
/* ゴールと方策。何の目標だったか思い出せないと、下の数字に意味が出ない */
.gsub{margin:9px 0 0;padding-left:9px;border-left:2px solid var(--rule)}
.glab{
  display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.14em;
  color:var(--ink-3);margin-bottom:2px;
}
.gplan{font-size:11.5px;color:var(--ink-2);line-height:1.8;white-space:pre-wrap}
.gempty{font-size:11.5px;color:var(--ink-3);margin-top:12px}
.gcard.out::before{background:var(--dye-4)}
.gnums .v.warn{color:var(--dye-1)}
/* ウエイトを帯で見せる。目標そのものの重さが一目で分かる */
.gbar{height:4px;border-radius:99px;background:var(--rule-soft);overflow:hidden;margin-bottom:11px}
.gbar i{display:block;height:100%;background:var(--dye-3)}
.gnums{display:flex;gap:18px}
.gnums div{display:flex;flex-direction:column;gap:1px}
.gnums .v{font-size:15px;font-weight:700;line-height:1.1}
.gnums .k{font-size:10px;letter-spacing:.08em;color:var(--ink-3)}

/* 案件の表。列の幅を固定して縦線で区切る。
   自動幅だと数字が案件名の隣に詰まって、どの列なのか読めなくなる */
.tbl{
  width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;
  table-layout:fixed;
}
.tbl col.cnum{width:52px}
.tbl th{
  text-align:center;font-size:9.5px;letter-spacing:.04em;color:var(--ink-3);
  font-weight:700;padding:0 0 7px;border-bottom:1px solid var(--rule);
  border-left:1px solid var(--rule-soft);
}
.tbl th:first-child{text-align:left;border-left:none;letter-spacing:.08em;font-size:10px}
.tbl td{
  padding:9px 4px;border-bottom:1px solid var(--rule-soft);
  border-left:1px solid var(--rule-soft);
  text-align:center;font-variant-numeric:tabular-nums;
}
.tbl td:first-child{
  text-align:left;font-weight:500;border-left:none;padding-left:0;
  overflow-wrap:anywhere;
}
.tbl tr.prow{cursor:pointer}
.tbl tr.prow:hover>td{background:var(--sunk)}
.tbl tr.prow.open>td{background:var(--sunk)}
.tbl .z{color:var(--ink-3);opacity:.35}
.tbl .warn{color:var(--dye-1);font-weight:700}
.tbl .okc{color:var(--ink-3)}
.tbl .caret{
  display:inline-block;width:12px;font-size:8.5px;color:var(--ink-3);
  margin-right:5px;vertical-align:1px;
}
.tbl .gtag{
  display:inline-block;font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px;
}
.tbl .gtag.none{color:var(--dye-1);border-color:var(--dye-4)}
.tbl.sub{margin-top:13px;margin-bottom:0}

/* 展開したタスク。案件行と同じ列に並べる。左端の帯は優先度の色 */
.tbl tr.trow{cursor:pointer;background:var(--sunk)}
.tbl tr.trow:hover>td{background:var(--paper)}
.tbl tr.trow>td{border-bottom:1px solid var(--rule-soft)}
.tbl tr.trow .tcell{padding-left:22px;position:relative}
.tbl tr.trow .pdot{
  position:absolute;left:8px;top:12px;width:3px;height:calc(100% - 22px);
  border-radius:2px;background:var(--dye);
}
.tbl tr.trow.d1{--dye:var(--dye-1)}
.tbl tr.trow.d2{--dye:var(--dye-2)}
.tbl tr.trow.d3{--dye:var(--dye-3)}
.tbl tr.trow.d4{--dye:var(--dye-4)}
.tbl .tt{font-size:12.5px;font-weight:500;line-height:1.5}
.tbl .tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:10.5px;color:var(--ink-2)}
.tbl .tna{
  margin-top:5px;font-size:11.5px;line-height:1.55;color:var(--warm-ink);
  background:var(--warm-bg);border:1px solid var(--warm-line);
  border-radius:5px;padding:4px 8px;display:inline-block;max-width:100%;
}
.tbl .tna.none{color:var(--ink-3);background:transparent;border-style:dashed;border-color:var(--rule)}
.tbl .mk{font-size:11px}
.tbl .mk.warn{color:var(--dye-1)}
.tbl .mk.ok{color:var(--dye-2)}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.75;margin:10px 0 0}

.rp-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rp-head label{margin:0}
.rp-head button{
  margin-left:auto;font-size:11.5px;font-weight:700;color:var(--dye-2);
  border:1px solid var(--rule);border-radius:6px;padding:4px 11px;transition:.14s;
}
.rp-head button:hover{border-color:var(--dye-2);background:var(--sunk)}
.fld textarea.rp{
  font-family:var(--font-mono);font-size:12.5px;line-height:1.75;min-height:132px;
}

/* ---------- 復帰モード ---------- */
.revive{
  position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto;display:none;
  padding:calc(30px + env(safe-area-inset-top)) 20px 44px;
}
.revive.on{display:block}
.revive .max{max-width:480px;margin:0 auto}
.revive h2{font-size:20px;font-weight:700;margin:0 0 8px;letter-spacing:.01em}
.revive .lead{color:var(--ink-2);font-size:13.5px;line-height:1.8;margin:0 0 26px}
.rprog{font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:12px}
.rcard{
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--dye-2);
  border-radius:10px;padding:18px;margin-bottom:16px;
}
.rcard .rt{font-size:16px;font-weight:700;line-height:1.55;margin-bottom:7px}
.rcard .rm{font-size:11.5px;color:var(--ink-2);margin-bottom:16px}
.r4{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.r4 button{
  border:1px solid var(--rule);border-radius:8px;padding:13px 6px;
  font-size:13.5px;background:var(--sunk);transition:.14s;
}
.r4 button:hover{border-color:var(--ink-3)}
.r4 button.go{background:var(--dye-2);border-color:var(--dye-2);color:#fff;font-weight:700}

/* ---------- ログイン ---------- */
.login{max-width:330px;margin:16vh auto;padding:0 22px}
.login .brand{margin-bottom:14px;padding:0}
.login h1{font-size:19px;font-weight:700;margin:0 0 6px}

  width:100%;background:var(--card);border:1px solid var(--rule);border-radius:8px;

/* ---------- 通知 ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(6px);bottom:88px;z-index:70;
  background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;
  padding:10px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(9,18,25,.28);
  display:flex;gap:14px;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:calc(100vw - 36px);
}
.toast.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.toast button{color:var(--dye-3);font-weight:700;flex:none}
@media (prefers-color-scheme:dark){.toast button{color:var(--dye-1)}}

/* 読み込み時の立ち上がり。控えめに一度だけ */
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.rise{animation:rise .26s cubic-bezier(.2,.7,.3,1) both}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none !important;transition:none !important}
}
/* ---------- 予定（カレンダー） ----------
   見方は2つだけ。月のマス目（全体を見る）と、日付順（その日の中の順番を見る）。
   繰り返し・終日・重なりの判定は入れていない。入れると編集項目が増えて続かない。 */
.calbar{display:flex;align-items:center;gap:8px;margin:16px 0 10px}

.cal{

.cal .ev{
  font-size:10px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-left:3px solid var(--dye-3);padding-left:3px;margin-bottom:1px;background:var(--sunk);

<script>
(function(){
"use strict";

var SB   = "https://neqnasakfyyttdbrgaaq.supabase.co";
var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lcW5hc2FrZnl5dHRkYnJnYWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzMwNjQsImV4cCI6MjEwMjg0OTA2NH0.LIThEpesQ-YQlXMm8JrfAyGD2rAf2XCUPbB5jhPeMEE";
var KEY  = "mytask.session.v1";

/* area（仕事／私用）は「表示するもの」を切り替えるだけ。リストは1本のまま。
   2つのリストに分けると片方が開かれなくなる（過去2回の失敗と同じ形）ので分けない。
   allTasks / allDone に全件を持ち、S.tasks / S.done は絞り込んだ結果を入れる。
   こうしておくと、既存の集計や描画に手を入れずに絞り込みが効く。 */
var S = { tab:"today", area:"all", tasks:[], done:[], allTasks:[], allDone:[],
          goals:[], plans:[], trips:[], sess:null, allMode:"project", updDir:"desc",
          pick:null, closed:{},
          /* 予定タブ。planMode は「月のマス目」か「日付順」 */
          planMode:"month", planPast:false, calPick:null,
          calY:new Date().getFullYear(), calM:new Date().getMonth()+1 };

function areaOf(t){ return (t && t.area) || "仕事"; }

function applyArea(){
  if(S.area==="all"){
    S.tasks=S.allTasks.slice();
    S.done =S.allDone.slice();
    return;
  }
  S.tasks=S.allTasks.filter(function(t){ return areaOf(t)===S.area; });
  /* 完了ログには area が無いので、元のタスクを引いて判断する。
     タスクごと消された分は元をたどれないので、絞り込み中は出さない。 */
  S.done=S.allDone.filter(function(x){
    for(var i=0;i<S.allTasks.length;i++)
      if(S.allTasks[i].id===x.task_id) return areaOf(S.allTasks[i])===S.area;
    return false;
  });
}

/* ---------- 日付（すべてローカル時刻） ---------- */
function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ if(!s) return null; var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function daysFrom(s){ var d=parseYmd(s); return d ? Math.round((d-today0())/86400000) : null; }
function daysSince(iso){ return iso ? Math.floor((Date.now()-new Date(iso).getTime())/86400000) : null; }
/* 更新日。「もう触ったのか、まだ触っていないのか」を一目で分かるようにする */
function fmtMd(iso){ var d=new Date(iso); return (d.getMonth()+1)+"/"+d.getDate(); }
function fmtDT(iso){
  var d=new Date(iso), p2=function(x){ return (100+x+"").slice(1); };
  return d.getFullYear()+"/"+p2(d.getMonth()+1)+"/"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes());
}
/* 「今日／昨日」は24時間ではなくカレンダーの日で数える。人の感覚に合わせる */
function calAgo(iso){ var d=new Date(iso); d.setHours(0,0,0,0); return Math.round((today0()-d)/86400000); }
function updLabel(iso){
  if(!iso) return null;
  var n=calAgo(iso);
  if(n<=0) return "更新 今日";
  if(n===1) return "更新 昨日";
  return "更新 "+fmtMd(iso)+"・"+n+"日前";
}
function dayHead(iso){
  if(!iso) return "更新日なし";
  var n=calAgo(iso);
  if(n<=0) return "今日";
  if(n===1) return "昨日";
  return fmtMd(iso)+"（"+n+"日前）";
}
function ymdOf(iso){ var d=new Date(iso); return d.getFullYear()+"-"+(101+d.getMonth()+"").slice(1)+"-"+(100+d.getDate()+"").slice(1); }
/* 目標コードだけでは何の目標か思い出せないので、必ず名前を添える */
function goalOf(code){
  for(var i=0;i<S.goals.length;i++) if(S.goals[i].code===code) return S.goals[i];
  return null;
}
function goalLabel(code){ var g=goalOf(code); return g ? g.code+" "+g.title : code; }
function nextMonday(){ var d=today0(); d.setDate(d.getDate()+((8-d.getDay())%7||7)); return ymd(d); }
function weekStart(){ var d=today0(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }

/* ---------- 通信 ---------- */
function saveSess(s){ s.expires_at=Math.floor(Date.now()/1000)+(s.expires_in||3600); S.sess=s; localStorage.setItem(KEY,JSON.stringify(s)); }
function loadSess(){ try{ S.sess=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ S.sess=null; } }
function authFetch(path,opt){
  opt=opt||{};
  opt.headers=Object.assign({apikey:ANON,Authorization:"Bearer "+(S.sess?S.sess.access_token:ANON),"Content-Type":"application/json"},opt.headers||{});
  return fetch(SB+path,opt);
}
function signIn(mail,pass){
  return fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",
    headers:{apikey:ANON,"Content-Type":"application/json"},
    body:JSON.stringify({email:mail,password:pass})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); });
}
function refresh(){
  if(!S.sess||!S.sess.refresh_token) return Promise.resolve(false);
  return fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
    headers:{apikey:ANON,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:S.sess.refresh_token})})
    .then(function(r){ return r.ok ? r.json().then(function(j){ saveSess(j); return true; }) : false; })
    .catch(function(){ return false; });
}
function api(path,opt){
  return authFetch(path,opt).then(function(r){
    if(r.status!==401) return r;
    return refresh().then(function(ok){
      if(!ok){ localStorage.removeItem(KEY); location.reload(); return r; }
      return authFetch(path,opt);
    });
  });
}
var T="/rest/v1/mytask_task", L="/rest/v1/mytask_done_log";
var P="/rest/v1/mytask_plan", TR="/rest/v1/mytask_trip";

function loadAll(){
  return Promise.all([
    api(T+"?select=*&order=sort_order.asc").then(function(r){ return r.json(); }),
    api(L+"?select=*&order=done_at.desc&limit=200").then(function(r){ return r.json(); }),
    api("/rest/v1/mytask_goal?select=*&order=sort.asc").then(function(r){ return r.json(); }),
    api(P+"?select=*&order=date.asc,start_time.asc.nullsfirst").then(function(r){ return r.json(); }),
    api(TR+"?select=*&order=start_date.asc").then(function(r){ return r.json(); })
  ]).then(function(a){
    S.allTasks=Array.isArray(a[0])?a[0]:[];
    S.allDone =Array.isArray(a[1])?a[1]:[];
    S.goals   =Array.isArray(a[2])?a[2]:[];
    S.plans   =Array.isArray(a[3])?a[3]:[];
    S.trips   =Array.isArray(a[4])?a[4]:[];
    applyArea();
  });
}
/* 絞り込みで隠れているタスクも操作できるよう、全件から探す */
function find(id){ for(var i=0;i<S.allTasks.length;i++) if(S.allTasks[i].id===id) return S.allTasks[i]; return null; }
function patch(id,body){
  var t=find(id); if(t) Object.assign(t,body); render();
  return api(T+"?id=eq."+id,{method:"PATCH",body:JSON.stringify(body)}).then(loadAll).then(render);
}
function create(body){ return api(T,{method:"POST",body:JSON.stringify(body)}).then(loadAll).then(render); }
function remove(id){ return api(T+"?id=eq."+id,{method:"DELETE"}).then(loadAll).then(render); }

/* ---------- 分類 ---------- */
/* 3日以上超過したものは一覧から自動的に退避させる。開くたびに責められる画面にしない */
function isSleeping(t){ if(t.status!=="open") return false; var d=daysFrom(t.deadline); return d!==null&&d<-3; }
function open_(){ return S.tasks.filter(function(t){ return t.status==="open"; }); }
function todays(){ return S.tasks.filter(function(t){ return t.status==="today"; }); }
function waits(){ return S.tasks.filter(function(t){ return t.status==="waiting"; }); }
function sleeping(){ return S.tasks.filter(isSleeping); }

/* ---------- 部品 ---------- */
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function $(id){ return document.getElementById(id); }

function toast(msg,undoFn){
  $("toastMsg").textContent=msg;
  var u=$("toastUndo");
  if(undoFn){ u.classList.remove("hide"); u.onclick=function(){ hideToast(); undoFn(); }; }
  else u.classList.add("hide");
  $("toast").classList.add("on");
  clearTimeout(toast._t);
  toast._t=setTimeout(hideToast, undoFn?12000:2600);
}
function hideToast(){ $("toast").classList.remove("on"); }

function copyText(text,msg){
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(msg); }
    catch(e){ toast("コピーできませんでした"); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); },fallback);
  }else fallback();
}

function dueLabel(t){
  var d=daysFrom(t.deadline);
  if(d===null) return null;
  if(d<0)  return {s:"超過 "+(-d)+"日",over:true};
  if(d===0) return {s:"今日",over:true};
  if(d===1) return {s:"明日",over:false};
  return {s:"あと "+d+"日",over:false};
}

function card(t,opt){
  opt=opt||{};
  var c=el("div","task d"+t.priority);

  var tick=el("button","tick");
  tick.setAttribute("aria-label","完了にする");
  tick.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 8.4l3.4 3.4L13.2 4.8"/></svg>';
  tick.onclick=function(ev){ ev.stopPropagation(); complete(t,c); };
  c.appendChild(tick);

  var b=el("div","body");
  b.appendChild(el("div","ttl",t.title));

  var m=el("div","meta");
  function add(node){ if(m.childNodes.length) m.appendChild(el("span","sep","·")); m.appendChild(node); }
  /* 私用だけ印を出す。仕事が大多数なので、そちらに印を付けると全部に付いて意味がなくなる */
  if(areaOf(t)!=="仕事") add(el("span","pill priv",areaOf(t)));
  add(el("span","proj",t.project));
  var dl=dueLabel(t); if(dl) add(el("span","due num"+(dl.over?" over":""),dl.s));
  var ul=updLabel(t.updated_at);
  if(ul) add(el("span","upd num"+(calAgo(t.updated_at)<=1?" fresh":""),ul));
  if(t.status==="waiting"&&t.waiting_for){
    var ds=daysSince(t.updated_at);
    add(el("span","wait","待ち "+t.waiting_for+(ds>0?"（"+ds+"日）":"")));
  }
  if(t.stuck_reason) add(el("span","pill",t.stuck_reason));
  if(t.postpone_count>0) add(el("span","pill","延期 "+t.postpone_count+"回"));
  if(t.goal) add(el("span","pill",goalLabel(t.goal)));
  (t.roles||[]).forEach(function(r){ add(el("span","pill",goalLabel(r))); });
  b.appendChild(m);

  if(t.next_action){
    var na=el("div","na");
    na.appendChild(el("span","arrow","▶"));
    na.appendChild(el("span",null,t.next_action));
    b.appendChild(na);
  }else{
    b.appendChild(el("div","na-empty","次の一手が未設定"));
  }

  /* 再開プロンプト：1タップでコピーして、新しいセッションに貼るだけにする */
  if(t.resume_prompt && !opt.flat){
    var rb=el("button","resume");
    rb.appendChild(el("span",null,"⧉"));
    rb.appendChild(el("span",null,"再開プロンプトをコピー"));
    rb.onclick=function(ev){ ev.stopPropagation(); copyText(t.resume_prompt,"再開プロンプトをコピーしました"); };
    b.appendChild(rb);
  }

  c.appendChild(b);
  c.onclick=function(){ openSheet(t); };
  return c;
}

function complete(t,node){
  var prev=t.status;
  if(node) node.classList.add("leaving");
  setTimeout(function(){ patch(t.id,{status:"done"}); },220);
  toast("完了にしました",function(){ patch(t.id,{status:prev}); });
}

function sec(title,count,key){
  var h=el(key?"button":"div","sec"+(key&&S.closed[key]?" closed":"")+(key?" click":""));
  h.appendChild(el("span","t",title));
  if(count!=null) h.appendChild(el("span","c num",String(count)));
  if(key){ h.appendChild(el("span","caret","▼")); h.onclick=function(){ S.closed[key]=!S.closed[key]; render(); }; }
  return h;
}

/* ---------- 描画 ---------- */
function render(){
  var d=new Date();
  $("today").innerHTML="";
  $("today").appendChild(document.createTextNode((d.getMonth()+1)+"月"+d.getDate()+"日"));
  $("today").appendChild(el("span","dow","日月火水木金土"[d.getDay()]));

  var ws=weekStart();
  var closedW=S.done.filter(function(x){ return new Date(x.done_at)>=ws; }).length;
  var newW=S.tasks.filter(function(x){ return new Date(x.created_at)>=ws; }).length;
  var f=$("flow"); f.innerHTML="";
  /* 押せば中身が見られる。数字だけ出して終わりにしない */
  function stat(k,v,opt){
    opt=opt||{};
    var s=el(opt.go?"button":"div","stat"+(opt.up?" up":"")+(opt.warn?" warn":"")+(opt.go?" click":""));
    s.appendChild(el("div","v num",String(v)));
    s.appendChild(el("div","k",k));
    if(opt.go) s.onclick=opt.go;
    f.appendChild(s);
  }
  var remain=S.tasks.filter(function(t){ return t.status!=="done"; }).length;
  stat("今週 終わった",closedW,{up:closedW>0,go:function(){ showPick("week-done"); }});
  stat("今週 増えた",newW,{go:function(){ showPick("week-new"); }});
  stat("残り",remain,{go:function(){ S.tab="all"; S.pick=null; S.allMode="project"; render(); window.scrollTo(0,0); }});
  stat("待ち",waits().length,{go:function(){ S.tab="waiting"; S.pick=null; render(); window.scrollTo(0,0); }});

  var tl=todays(), wl=waits(), ol=open_();
  $("n_today").textContent=tl.length||"";
  $("n_wait").textContent=wl.length||"";
  $("n_plan").textContent=(typeof plansOn==="function"?plansOn(ymd(today0())).length:0)||"";
  $("n_all").textContent=tl.length+wl.length+ol.length;

  Array.prototype.forEach.call(document.querySelectorAll(".tabs > button"),function(b){
    b.classList.toggle("on",b.dataset.tab===S.tab);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".areasw button"),function(b){
    b.classList.toggle("on",b.dataset.area===S.area);
  });

  var L2=$("list"); L2.innerHTML="";
  if(S.tab==="today")   renderToday(L2,tl);
  if(S.tab==="plan")    renderPlan(L2);
  if(S.tab==="waiting") renderWaiting(L2,wl);
  if(S.tab==="all")     renderAll(L2);
  if(S.tab==="map")     renderMap(L2);

  var i=0;
  Array.prototype.forEach.call(L2.querySelectorAll(".task"),function(n){
    if(i<9){ n.classList.add("rise"); n.style.animationDelay=(i*22)+"ms"; }
    i++;
  });
}

/* 押し間違いは必ず起きる。いつでも戻せるようにしておく */

/* ヘッダーの数字から中身へ。押した数字が何だったのか分かる形で出す */
function showPick(kind){
  S.tab="all"; S.pick=kind; render(); window.scrollTo(0,0);
}
function pickList(L2){
  var ws=weekStart();
  var title, list=[], isDone=false;
  if(S.pick==="week-done"){
    title="今週 終わったもの";
    isDone=true;
    list=S.done.filter(function(x){ return new Date(x.done_at)>=ws; });
  }else{
    title="今週 増えたもの（今週つくったタスク）";
    list=S.tasks.filter(function(t){ return new Date(t.created_at)>=ws && t.status!=="done"; }).sort(byPri);
  }
  var b=el("button","btn wide","← 全部の一覧に戻る");
  b.onclick=function(){ S.pick=null; render(); window.scrollTo(0,0); };
  L2.appendChild(b);
  L2.appendChild(sec(title,list.length));
  if(!list.length){ L2.appendChild(el("p","note","今週はありません。")); return; }
  if(isDone) list.forEach(function(x){ L2.appendChild(doneRow(x.title,x.task_id)); });
  else list.forEach(function(t){ L2.appendChild(card(t)); });
}

function renderAll(L2){
  if(S.pick){ pickList(L2); return; }
  var seg=el("div","seg"); seg.style.margin="20px 0 4px";
  [["project","案件別"],["deadline","締切別"],["updated","更新順"]].forEach(function(p){
    var b=el("button",S.allMode===p[0]?"on":null,p[1]);
    b.onclick=function(){ S.allMode=p[0]; render(); };
    seg.appendChild(b);
  });
  L2.appendChild(seg);

  var live=S.tasks.filter(function(t){ return t.status!=="done"&&!isSleeping(t); });
  var slp=sleeping();

  if(S.allMode==="updated"){
    /* 何を更新済みで、何を長く触っていないか。日付ごとにまとめて出す */
    var dir=el("div","seg"); dir.style.margin="10px 0 4px";
    [["desc","新しい順"],["asc","古い順"]].forEach(function(p){
      var b=el("button",S.updDir===p[0]?"on":null,p[1]);
      b.onclick=function(){ S.updDir=p[0]; render(); };
      dir.appendChild(b);
    });
    L2.appendChild(dir);
    L2.appendChild(el("p","note","「古い順」は長く触っていないものが先に出ます。"));

    var arr=live.slice().concat(slp).sort(function(a,b){
      var x=a.updated_at||"", y=b.updated_at||"";
      if(x===y) return byPri(a,b);
      return S.updDir==="desc" ? (x<y?1:-1) : (x<y?-1:1);
    });
    var uk=null;
    arr.forEach(function(t){
      var k=t.updated_at?ymdOf(t.updated_at):"none";
      if(k!==uk){
        uk=k;
        var cnt=arr.filter(function(x){ return (x.updated_at?ymdOf(x.updated_at):"none")===k; }).length;
        L2.appendChild(sec(dayHead(t.updated_at),cnt,"u:"+k));
      }
      if(!S.closed["u:"+k]) L2.appendChild(card(t));
    });
    if(!arr.length) L2.appendChild(el("p","note","タスクがありません。"));
    return;
  }

  if(S.allMode==="project"){
    var g={};
    live.forEach(function(t){ (g[t.project]=g[t.project]||[]).push(t); });
    Object.keys(g).forEach(function(k){
      L2.appendChild(sec(k,g[k].length,"p:"+k));
      if(!S.closed["p:"+k]) g[k].sort(byPri).forEach(function(t){ L2.appendChild(card(t)); });
    });
  }else{
    var buckets=[["今週まで",[]],["今月まで",[]],["それ以降",[]],["締切なし",[]]];
    live.forEach(function(t){
      var d=daysFrom(t.deadline);
      if(d===null) buckets[3][1].push(t);
      else if(d<=7) buckets[0][1].push(t);
      else if(d<=31) buckets[1][1].push(t);
      else buckets[2][1].push(t);
    });
    buckets.forEach(function(b){
      if(!b[1].length) return;
      L2.appendChild(sec(b[0],b[1].length,"d:"+b[0]));
      if(!S.closed["d:"+b[0]]) b[1].sort(byPri).forEach(function(t){ L2.appendChild(card(t)); });
    });
  }

  var recent=S.done.filter(function(x){ return (Date.now()-new Date(x.done_at).getTime())<7*86400000; });
  if(recent.length){
    var dk="donerecent";
    if(S.closed[dk]===undefined) S.closed[dk]=true;
    L2.appendChild(sec("完了（直近1週間）",recent.length,dk));
    if(!S.closed[dk]) recent.forEach(function(x){ L2.appendChild(doneRow(x.title,x.task_id)); });
  }

  if(slp.length){
    var key="sleep";
    if(S.closed[key]===undefined) S.closed[key]=true;
    L2.appendChild(sec("おやすみ中（3日以上 締切超過）",slp.length,key));
    if(!S.closed[key]){
      slp.sort(byPri).forEach(function(t){ L2.appendChild(card(t)); });
      var b=el("button","btn wide","まとめて仕分けする");
      b.onclick=function(){ startRevive(slp); };
      L2.appendChild(b);
    }
  }
}
function byPri(a,b){
  if(a.priority!==b.priority) return a.priority-b.priority;
  var da=daysFrom(a.deadline), db=daysFrom(b.deadline);
  if(da===null&&db===null) return a.sort_order-b.sort_order;
  if(da===null) return 1;
  if(db===null) return -1;
  return da-db;
}

/* ---------- まとめ ----------
   これで評価される目標方策と、その下にぶら下がる案件を1画面に置く。
   数字は自慢のためではなく、どこが手薄かを見つけるために出す。 */
function renderMap(L2){
  var live=S.tasks.filter(function(t){ return t.status!=="done"; });
  /* まとめは俯瞰用。案件は既定で閉じておく（開きっぱなしだと一覧の意味が無くなる） */
  if(!S.mapInit){
    S.mapInit=true;
    S.tasks.forEach(function(t){
      ["G1","G2","G3","R1","R2","OUT","ALL"].forEach(function(pre){
        if(S.closed[pre+":"+t.project]===undefined) S.closed[pre+":"+t.project]=true;
      });
    });
  }

  /* 案件ごとにまとめておく */
  var byProj={}, projOrder=[];
  live.forEach(function(t){
    if(!byProj[t.project]){ byProj[t.project]=[]; projOrder.push(t.project); }
    byProj[t.project].push(t);
  });
  var doneByProj={};
  S.done.forEach(function(x){ var k=x.project||"-"; doneByProj[k]=(doneByProj[k]||0)+1; });

  function projsFor(test){
    return projOrder.filter(function(k){ return byProj[k].some(test); });
  }

  /* 案件の表。列がずれないよう幅を固定し、縦線で区切る。
     展開したタスクも同じ列に並べる（緊急・待ちがどれなのか、開いても分かるように） */
  var COLS=["案件","件数","緊急","待ち","一手なし","再開","済"];
  function tableShell(cls){
    var tb=el("table","tbl"+(cls?" "+cls:""));
    var cg=el("colgroup");
    cg.appendChild(el("col","cname"));
    for(var i=0;i<6;i++) cg.appendChild(el("col","cnum"));
    tb.appendChild(cg);
    var th=el("tr");
    COLS.forEach(function(x){ th.appendChild(el("th",null,x)); });
    var head=el("thead"); head.appendChild(th); tb.appendChild(head);
    return tb;
  }
  function dot(on,cls,label){
    var d=el("td","num"+(on?"":" z"));
    if(on){ var m=el("span","mk"+(cls?" "+cls:"")); m.textContent=label; d.appendChild(m); }
    else d.textContent="·";
    return d;
  }
  /* 展開したタスク1件分。列は案件行と揃える */
  function taskRow(t){
    var tr=el("tr","trow d"+t.priority);
    var c1=el("td","tcell");
    var ttl=el("div","tt");
    ttl.appendChild(el("span","pdot"));
    ttl.appendChild(el("span",null,t.title));
    c1.appendChild(ttl);
    var meta=el("div","tmeta");
    var dl=dueLabel(t);
    if(dl) meta.appendChild(el("span","due num"+(dl.over?" over":""),dl.s));
    var ul=updLabel(t.updated_at);
    if(ul) meta.appendChild(el("span","upd num"+(calAgo(t.updated_at)<=1?" fresh":""),ul));
    if(t.stuck_reason) meta.appendChild(el("span","pill",t.stuck_reason));
    if(meta.childNodes.length) c1.appendChild(meta);
    c1.appendChild(el("div",t.next_action?"tna":"tna none",
      t.next_action ? "▶ "+t.next_action : "▶ 次の一手が未設定"));
    tr.appendChild(c1);
    tr.appendChild(el("td","num z","·"));
    tr.appendChild(dot(t.priority===1,"warn","🔴"));
    var w=dot(t.status==="waiting","","待"); if(t.waiting_for) w.title=t.waiting_for; tr.appendChild(w);
    tr.appendChild(dot(!t.next_action,"warn","●"));
    tr.appendChild(dot(!!t.resume_prompt,"ok","⧉"));
    tr.appendChild(el("td","num z","·"));
    tr.onclick=function(ev){ ev.stopPropagation(); openSheet(t); };
    return tr;
  }
  /* 案件1行分＋開いているときはその下にタスク行 */
  function projRows(tbody,names,keyPrefix,withTag){
    names.forEach(function(k){
      var ts=byProj[k];
      var key=keyPrefix+":"+k, open=!S.closed[key];
      var urgent=ts.filter(function(t){return t.priority===1;}).length;
      var tr=el("tr","prow"+(open?" open":""));
      var c1=el("td");
      c1.appendChild(el("span","caret",open?"▼":"▶"));
      c1.appendChild(document.createTextNode(k));
      if(withTag){
        var gset=[];
        ts.forEach(function(t){ if(t.goal&&gset.indexOf(t.goal)<0) gset.push(t.goal); });
        if(!gset.length) ts.forEach(function(t){
          (t.roles||[]).forEach(function(r){ if(gset.indexOf(r)<0) gset.push(r); });
        });
        gset.sort().forEach(function(code){ c1.appendChild(el("span","gtag",goalLabel(code))); });
        if(!gset.length) c1.appendChild(el("span","gtag none","紐づけなし"));
      }
      tr.appendChild(c1);
      function cell(v,cls){ tr.appendChild(el("td",(v===0?"z ":"")+(cls||"")+" num",String(v))); }
      cell(ts.length);
      cell(urgent, urgent?"warn":"");
      cell(ts.filter(function(t){return t.status==="waiting";}).length);
      cell(ts.filter(function(t){return !t.next_action;}).length,
           ts.filter(function(t){return !t.next_action;}).length?"warn":"");
      cell(ts.filter(function(t){return t.resume_prompt;}).length);
      cell(doneByProj[k]||0,"okc");
      tr.onclick=function(){ S.closed[key]=open; render(); };
      tbody.appendChild(tr);
      if(open) ts.slice().sort(byPri).forEach(function(t){ tbody.appendChild(taskRow(t)); });
    });
  }
  function projTable(host,names,keyPrefix){
    if(!names.length){
      host.appendChild(el("div","gempty","ぶら下がっている案件がありません"));
      return;
    }
    var tb=tableShell("sub"), tbody=el("tbody");
    projRows(tbody,names,keyPrefix,false);
    tb.appendChild(tbody);
    host.appendChild(tb);
  }

  function goalCard(g,ts,names,showBar){
    var c=el("div","gcard");
    var h=el("div","ghead");
    h.appendChild(el("span","gcode",g.code));
    h.appendChild(el("span","gttl",g.title));
    var wt=el("span","gwt");
    wt.appendChild(el("b",null,String(g.weight)));
    wt.appendChild(document.createTextNode(" %"));
    h.appendChild(wt);
    c.appendChild(h);

    if(g.aim){
      var a=el("div","gsub");
      a.appendChild(el("span","glab","ゴール"));
      a.appendChild(el("div","gaim",g.aim));
      c.appendChild(a);
    }
    if(g.plan){
      var pl=el("div","gsub");
      pl.appendChild(el("span","glab","方策"));
      pl.appendChild(el("div","gplan",g.plan));
      c.appendChild(pl);
    }
    if(showBar){
      var bar=el("div","gbar"); var fill=el("i"); fill.style.width=g.weight+"%"; bar.appendChild(fill);
      c.appendChild(bar);
    }
    var n=el("div","gnums");
    function num(k,v,warn){
      var d=el("div");
      d.appendChild(el("div","v num"+(warn&&v?" warn":""),String(v)));
      d.appendChild(el("div","k",k));
      n.appendChild(d);
    }
    num("残タスク",ts.length);
    num("緊急",ts.filter(function(t){ return t.priority===1; }).length);
    num("待ち",ts.filter(function(t){ return t.status==="waiting"; }).length);
    num("次の一手なし",ts.filter(function(t){ return !t.next_action; }).length,true);
    c.appendChild(n);
    projTable(c,names,g.code);
    return c;
  }

  L2.appendChild(sec("目標方策（第50期下期・〜12月）"));
  S.goals.filter(function(g){ return g.kind==="goal"; }).forEach(function(g){
    var ts=live.filter(function(t){ return t.goal===g.code; });
    var names=projsFor(function(t){ return t.goal===g.code; });
    L2.appendChild(goalCard(g,ts,names,true));
  });

  var roles=S.goals.filter(function(g){ return g.kind==="role"; });
  if(roles.length){
    L2.appendChild(sec("本人評価"));
    roles.forEach(function(g){
      var ts=live.filter(function(t){ return (t.roles||[]).indexOf(g.code)>=0; });
      var names=projsFor(function(t){ return (t.roles||[]).indexOf(g.code)>=0; });
      L2.appendChild(goalCard(g,ts,names,false));
    });
  }

  /* どの目標にも本人評価にもぶら下がらないもの。隠さずに並べる */
  function unlinked(t){ return !t.goal && !(t.roles||[]).length; }
  var outNames=projsFor(unlinked);
  if(outNames.length){
    L2.appendChild(sec("目標方策外"));
    var oc=el("div","gcard out");
    var oh=el("div","ghead");
    oh.appendChild(el("span","gttl","評価に紐づいていないもの"));
    oc.appendChild(oh);
    oc.appendChild(el("div","gaim","会社から指示されていない、自分でどうにかしたいもの。ここが増えすぎていないかだけ見る。"));
    var ots=live.filter(unlinked);
    var on=el("div","gnums");
    var od=el("div"); od.appendChild(el("div","v num",String(ots.length))); od.appendChild(el("div","k","残タスク")); on.appendChild(od);
    oc.appendChild(on);
    projTable(oc,outNames,"OUT");
    L2.appendChild(oc);
  }

  /* 案件別の一覧 */
  L2.appendChild(sec("案件別"));
  var order=projOrder.slice().sort(function(a,b){
    var ua=byProj[a].filter(function(t){return t.priority===1;}).length;
    var ub=byProj[b].filter(function(t){return t.priority===1;}).length;
    return ub-ua || byProj[b].length-byProj[a].length;
  });

  var tb=tableShell(null), tbody=el("tbody");
  projRows(tbody,order,"ALL",true);
  tb.appendChild(tbody);
  L2.appendChild(tb);

  var nn=live.filter(function(t){ return !t.next_action; }).length;
  L2.appendChild(el("p","note",
    "案件を押すと、その場でタスクが開きます（画面は移動しません）。タスクを押すと詳細が出ます。"+
    "「一手なし」は、次に何をするか決まっていないタスクです。現在 "+nn+" 件。"+
    "ここが埋まっていないものほど放置されます。「再開」は再開プロンプトが書いてある件数、「済」は完了ログの件数です。"));
}

/* ---------- 詳細 ---------- */
function openSheet(t){
  var body=$("sheetBody"); body.innerHTML="";

  function fld(label,key,tag,hint){
    var w=el("div","fld");
    w.appendChild(el("label",null,label));
    var i=el(tag||"input");
    i.value=t[key]==null?"":t[key];
    if(tag==="textarea") i.rows=2;
    i.onchange=function(){ var o={}; o[key]=i.value||null; patch(t.id,o); };
    w.appendChild(i);
    if(hint) w.appendChild(el("div","hint",hint));
    body.appendChild(w);
    return i;
  }

  fld("タスク","title");
  fld("次の一手（次の15分で終わること）","next_action","textarea",
      "ここが空だと、開くたびに何をするか考え直すことになります。");

  /* 再開プロンプト。新しいセッションにそのまま貼れる形で持っておく */
  var rw=el("div","fld");
  var rh=el("div","rp-head");
  rh.appendChild(el("label",null,"再開プロンプト"));
  var cp=el("button",null,"コピー");
  rh.appendChild(cp);
  rw.appendChild(rh);
  var rt=el("textarea","rp");
  rt.rows=7;
  rt.placeholder="次のセッションをここから始めるための文章。読むべきObsidianノート、作業フォルダ、前回までの状況、次にやることを書いておく。";
  rt.value=t.resume_prompt||"";
  rt.onchange=function(){ patch(t.id,{resume_prompt:rt.value||null}); };
  cp.onclick=function(){
    if(!rt.value.trim()){ toast("まだ書かれていません"); return; }
    copyText(rt.value,"再開プロンプトをコピーしました");
  };
  rw.appendChild(rt);
  rw.appendChild(el("div","hint","コピーして、新しいClaudeのセッションに貼り付ければ続きから始められます。"));
  body.appendChild(rw);

  /* 目標方策との紐づけ。評価に効くので、どれにも属さないタスクを作らない */
  var gw=el("div","fld"); gw.appendChild(el("label",null,"目標方策（成果評価）"));
  var gs=el("div","seg goals");
  S.goals.filter(function(g){ return g.kind==="goal"; }).forEach(function(g){

  var quick=el("div","btnrow"); quick.style.marginTop="8px";

  if(t.status!=="waiting") act("待ちにする",null,function(){ patch(t.id,{status:"waiting"}); closeSheet(); });

function showSheet(){ $("sheet").classList.add("on"); $("scrim").classList.add("on"); $("sheet").scrollTop=0; }
function closeSheet(){ $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }

/* ---------- 復帰モード ---------- */
/* 久しぶりに開いたとき、超過の山をそのまま見せない。
   最大10件を1件ずつ4択で決め直し、「今日見るのは n 件」に変換して終わる */
var RV={queue:[],i:0};
function startRevive(list){
  RV.queue=list.slice().sort(byPri).slice(0,10); RV.i=0;
  $("revive").classList.add("on"); drawRevive();
}
function drawRevive(){
  var b=$("reviveBody"); b.innerHTML="";
  if(RV.i>=RV.queue.length){
    b.appendChild(el("h2",null,"仕分け終わりです"));
    var n=todays().length;
    b.appendChild(el("p","lead",n?"今日見るタスクは "+n+" 件です。":"今日の箱は空のままにしました。あとで選べます。"));
    var g=el("button","btn pri wide","通常の画面に戻る");
    g.onclick=function(){ $("revive").classList.remove("on"); touchState(); render(); };
    b.appendChild(g); return;
  }
  var t=RV.queue[RV.i];
  b.appendChild(el("h2",null,"しばらく開いていませんでした"));
  b.appendChild(el("p","lead","締切を過ぎたものが "+RV.queue.length+" 件あります。責める必要はありません。いま決め直すだけです。"));
  b.appendChild(el("div","rprog num",(RV.i+1)+" / "+RV.queue.length));

  var c=el("div","rcard");
  c.appendChild(el("div","rt",t.title));
  var d=daysFrom(t.deadline);
  c.appendChild(el("div","rm",t.project+"　"+(d!==null?"締切を "+(-d)+"日 過ぎています":"締切なし")));
  var g4=el("div","r4");
  function b4(label,cls,body){
    var x=el("button",cls,label);
    x.onclick=function(){ patch(t.id,body); RV.i++; drawRevive(); };
    g4.appendChild(x);
  }
  b4("今日やる","go",{status:"today",deadline:ymd(today0())});
  b4("来週に送る",null,{status:"open",deadline:nextMonday()});
  b4("待ちにする",null,{status:"waiting"});
  b4("いつかに落とす",null,{status:"open",priority:4,deadline:null});
  c.appendChild(g4); b.appendChild(c);

  var skip=el("button","btn wide","残りはあとで整理する");
  skip.onclick=function(){ RV.i=RV.queue.length; drawRevive(); };
  b.appendChild(skip);
}
function touchState(){
  api("/rest/v1/mytask_state",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},
    body:JSON.stringify({owner_id:S.sess.user.id,last_opened_at:new Date().toISOString()})});
}
function maybeRevive(){
  return api("/rest/v1/mytask_state?select=last_opened_at&limit=1")
    .then(function(r){ return r.json(); })
    .then(function(j){
      var last=(Array.isArray(j)&&j[0])?j[0].last_opened_at:null;
      var gap=last?daysSince(last):999;
      var slp=sleeping();
      if(slp.length>=5&&gap>=3) startRevive(slp); else touchState();
    }).catch(function(){});
}

/* ---------- 予定（カレンダー） ----------
   置くのは索引だけ。音声・写真・文字起こしの中身はここに入れない（自宅PCのローカルに置く）。
   見方は「月のマス目」と「日付順」の2つ。繰り返し・終日・重なりの判定は入れていない。 */
var KINDS=["移動","宿泊","現場","会議","オフ","その他"];
var KCLS={"移動":"k-move","宿泊":"k-stay","現場":"k-site","会議":"k-meet","オフ":"k-off","その他":"k-etc"};
var DOW="日月火水木金土";

function hhmm(t){ return t?String(t).slice(0,5):""; }
function planList(){
  return S.plans.filter(function(p){ return S.area==="all"||areaOf(p)===S.area; });
}
function cmpTime(a,b){
  /* 時刻なしは、その日の先頭に置く（終日の予定に近い扱い） */
  var x=a.start_time||"", y=b.start_time||"";
  if(x!==y) return x<y?-1:1;
  return (a.title||"")<(b.title||"")?-1:1;
}
function plansOn(d){ return planList().filter(function(p){ return p.date===d; }).sort(cmpTime); }
function duesOn(d){ return S.tasks.filter(function(t){ return t.status!=="done"&&t.deadline===d; }); }
function tripOf(id){ if(!id) return null; for(var i=0;i<S.trips.length;i++) if(S.trips[i].id===id) return S.trips[i]; return null; }
function tripOn(d){
  for(var i=0;i<S.trips.length;i++){
    var t=S.trips[i];
    if(t.start_date&&t.end_date&&d>=t.start_date&&d<=t.end_date) return t;
  }
  return null;
}
function dayLabel(key){
  var d=parseYmd(key); if(!d) return key;
  var n=Math.round((d-today0())/86400000);
  var s=(d.getMonth()+1)+"月"+d.getDate()+"日（"+DOW[d.getDay()]+"）";
  if(n===0) return s+"　今日";
  if(n===1) return s+"　あした";
  if(n===-1) return s+"　きのう";
  return s;
}
function evNode(p){
  var e=el("div","ev "+(KCLS[p.kind]||"k-etc"));
  e.textContent=(hhmm(p.start_time)?hhmm(p.start_time)+" ":"")+p.title;
  return e;
}
function planRow(p){
  var r=el("button","prow");
  var tm=el("div","tm");
  tm.appendChild(el("div",null,hhmm(p.start_time)||"—"));
  if(p.end_time) tm.appendChild(el("div","tm2","〜"+hhmm(p.end_time)));
  r.appendChild(tm);
  var b=el("div","body");
  var t=el("div","tt");
  t.appendChild(document.createTextNode(p.title));
  t.appendChild(el("span","kchip "+(KCLS[p.kind]||"k-etc"),p.kind));
  b.appendChild(t);
  var sub=[];
  if(p.place) sub.push(p.place);
  var tr=tripOf(p.trip_id); if(tr) sub.push(tr.name);
  if(p.note) sub.push(p.note);
  if(sub.length) b.appendChild(el("div","pl",sub.join("　·　")));
  r.appendChild(b);
  r.onclick=function(){ openPlanSheet(p); };
  return r;
}
function dueRow(t){
  var r=el("button","prow");
  var tm=el("div","tm"); tm.appendChild(el("div",null,"締切"));
  r.appendChild(tm);
  var b=el("div","body");
  var tt=el("div","tt"); tt.textContent=t.title; b.appendChild(tt);
  b.appendChild(el("div","pl",t.project));
  r.appendChild(b);
  r.onclick=function(){ openSheet(t); };
  return r;
}

function renderPlan(L2){
  var seg=el("div","seg"); seg.style.margin="18px 0 4px";
  [["month","月のマス目"],["list","日付順"]].forEach(function(p){
    var b=el("button",S.planMode===p[0]?"on":null,p[1]);
    b.onclick=function(){
      S.planMode=p[0];
      try{ localStorage.setItem("mytask.planMode",p[0]); }catch(e){}
      render(); window.scrollTo(0,0);
    };
    seg.appendChild(b);
  });
  L2.appendChild(seg);

  if(S.planMode==="list") renderPlanList(L2); else renderMonth(L2);

  var add=el("button","btn pri wide","＋ 予定を入れる");
  add.style.marginTop="16px";
  add.onclick=function(){ openPlanSheet(null); };
  L2.appendChild(add);
  var addt=el("button","btn wide","＋ 出張をつくる");
  addt.style.marginTop="8px";
  addt.onclick=function(){ openTripSheet(null); };
  L2.appendChild(addt);
}

function shiftMonth(n){
  var d=new Date(S.calY,S.calM-1+n,1);
  S.calY=d.getFullYear(); S.calM=d.getMonth()+1; S.calPick=null; render();
}

function renderMonth(L2){
  var bar=el("div","calbar");
  var prev=el("button","btn","‹"); prev.title="前の月"; prev.onclick=function(){ shiftMonth(-1); };
  var next=el("button","btn","›"); next.title="次の月"; next.onclick=function(){ shiftMonth(1); };
  var now=el("button","btn","今月");
  now.onclick=function(){ var d=new Date(); S.calY=d.getFullYear(); S.calM=d.getMonth()+1; S.calPick=ymd(today0()); render(); };
  bar.appendChild(prev);
  bar.appendChild(el("div","ym",S.calY+"年"+S.calM+"月"));
  bar.appendChild(next);
  now.style.marginLeft="auto"; bar.appendChild(now);
  L2.appendChild(bar);

  /* この月にかかっている出張。押せば中身を直せる */
  var mS=ymd(new Date(S.calY,S.calM-1,1)), mE=ymd(new Date(S.calY,S.calM,0));
  S.trips.filter(function(t){
    if(!t.start_date||!t.end_date) return false;
    return !(t.end_date<mS||t.start_date>mE);
  }).forEach(function(t){ L2.appendChild(tripCard(t)); });

  var g=el("div","cal");
  DOW.split("").forEach(function(c,i){
    g.appendChild(el("div","dow"+(i===0?" sun":i===6?" sat":""),c));
  });
  var first=new Date(S.calY,S.calM-1,1);
  var offset=first.getDay();                       /* 日曜はじまり */
  var dim=new Date(S.calY,S.calM,0).getDate();
  var cells=Math.ceil((offset+dim)/7)*7;
  var tstr=ymd(today0());
  for(var i=0;i<cells;i++){
    var d=new Date(S.calY,S.calM-1,1-offset+i);
    var key=ymd(d);
    var c=el("button","cell");
    if(d.getMonth()!==S.calM-1) c.classList.add("out");
    if(key===tstr) c.classList.add("today");
    if(S.calPick===key) c.classList.add("on");
    if(tripOn(key)) c.classList.add("trip");
    c.appendChild(el("span","dnum",String(d.getDate())));
    var ps=plansOn(key), ds=duesOn(key), n=0;
    for(var j=0;j<ps.length&&n<3;j++,n++) c.appendChild(evNode(ps[j]));
    for(var k=0;k<ds.length&&n<3;k++,n++) c.appendChild(el("div","ev due","締 "+ds[k].title));
    var rest=ps.length+ds.length-n;
    if(rest>0) c.appendChild(el("div","more","ほか "+rest));
    (function(kk){ c.onclick=function(){ S.calPick=(S.calPick===kk?null:kk); render(); }; })(key);
    g.appendChild(c);
  }
  L2.appendChild(g);

  /* 押した日の中身を、時刻順に下へ出す */
  if(S.calPick){
    var ps2=plansOn(S.calPick), ds2=duesOn(S.calPick);
    L2.appendChild(sec(dayLabel(S.calPick),ps2.length+ds2.length||null));
    var tr=tripOn(S.calPick);
    if(tr){
      var tag=el("div","pl"); tag.style.margin="0 2px 8px";
      tag.textContent="出張中："+tr.name;
      L2.appendChild(tag);
    }
    ps2.forEach(function(p){ L2.appendChild(planRow(p)); });
    ds2.forEach(function(t){ L2.appendChild(dueRow(t)); });
    if(!ps2.length&&!ds2.length){
      var e=el("div","pl"); e.style.margin="0 2px 8px";
      e.textContent="この日はまだ何も入っていません。";
      L2.appendChild(e);
    }
    var a=el("button","btn wide","この日に予定を入れる");
    a.style.marginTop="4px";
    a.onclick=function(){ openPlanSheet({date:S.calPick}); };
    L2.appendChild(a);
  }
}

function renderPlanList(L2){
  var t0=ymd(today0());
  var keys={};
  planList().forEach(function(p){ if(S.planPast||p.date>=t0) keys[p.date]=1; });
  S.tasks.forEach(function(t){
    if(t.status!=="done"&&t.deadline&&(S.planPast||t.deadline>=t0)) keys[t.deadline]=1;
  });
  var days=Object.keys(keys).sort();
  if(S.planPast) days.reverse();
  if(!days.length){
    var e=el("div","empty");
    e.appendChild(el("div","big","これからの予定はありません"));
    e.appendChild(el("p",null,"下の「予定を入れる」から足せます。飛行機とホテルをメールから入れるのは、この次の段です。"));
    L2.appendChild(e);
  }
  days.forEach(function(key){
    var ps=plansOn(key), ds=duesOn(key);
    L2.appendChild(sec(dayLabel(key),ps.length+ds.length));
    var tr=tripOn(key);
    if(tr){
      var tag=el("div","pl"); tag.style.margin="0 2px 8px";
      tag.textContent="出張中："+tr.name;
      L2.appendChild(tag);
    }
    ps.forEach(function(p){ L2.appendChild(planRow(p)); });
    ds.forEach(function(t){ L2.appendChild(dueRow(t)); });
  });
  var sw=el("button","btn wide",S.planPast?"これからの予定だけ見る":"前の予定も見る");
  sw.style.marginTop="10px";
  sw.onclick=function(){ S.planPast=!S.planPast; render(); window.scrollTo(0,0); };
  L2.appendChild(sw);
}

function tripCard(t){
  var c=el("button","tripcard");
  c.appendChild(el("div","tn",t.name));
  var s=[];
  if(t.start_date&&t.end_date){
    var a=parseYmd(t.start_date), b=parseYmd(t.end_date);
    var days=Math.round((b-a)/86400000)+1;
    s.push((a.getMonth()+1)+"/"+a.getDate()+"（"+DOW[a.getDay()]+"）〜"
          +(b.getMonth()+1)+"/"+b.getDate()+"（"+DOW[b.getDay()]+"）　"+days+"日間");
  }
  if(t.place) s.push(t.place);
  s.push("予定 "+planList().filter(function(p){ return p.trip_id===t.id; }).length+"件");
  c.appendChild(el("div","td",s.join("　·　")));
  c.onclick=function(){ openTripSheet(t); };
  return c;
}

function openPlanSheet(p){
  var isNew=!p||!p.id;
  var v={
    kind:(p&&p.kind)||"その他",
    area:(p&&p.area)||(S.area==="私用"?"私用":"仕事")
  };

      v.kind=k;

    };

  var o0=el("option",null,"（出張に紐づけない）"); o0.value=""; ts.appendChild(o0);
  S.trips.forEach(function(t){
    var o=el("option",null,t.name); o.value=t.id;

    ts.appendChild(o);
  });
  body.appendChild(fldWrap("出張",ts,"出張に紐づけた予定は、あとで録音と写真を区切る物差しになります。"));

  var aw=el("div","fld"); aw.appendChild(el("label",null,"仕事 / 私用"));
  var as=el("div","seg");
  ["仕事","私用"].forEach(function(x){
    var b=el("button",v.area===x?"on":null,x);
    b.onclick=function(){
      v.area=x;
      Array.prototype.forEach.call(as.children,function(y){ y.classList.toggle("on",y.textContent===x); });
    };
    as.appendChild(b);
  });
  aw.appendChild(as); body.appendChild(aw);

  var ni=el("textarea"); ni.rows=2; ni.value=(p&&p.note)||"";
  body.appendChild(fldWrap("メモ",ni));

  var row=el("div","btnrow"); row.style.margin="22px 0 6px";
  var save=el("button","btn pri",isNew?"入れる":"保存する");
  save.onclick=function(){
    var title=ti.value.trim();
    if(!title){ toast("題名を入れてください。"); return; }
    if(!di.value){ toast("日付を入れてください。"); return; }
    var b={ title:title, date:di.value,
            start_time:si.value||null, end_time:ei.value||null,
            place:pi.value.trim()||null, kind:v.kind, note:ni.value.trim()||null,
            trip_id:ts.value||null, area:v.area };
    var d=parseYmd(b.date);
    if(d){ S.calY=d.getFullYear(); S.calM=d.getMonth()+1; S.calPick=b.date; }
    (isNew?createPlan(b):patchPlan(p.id,b));
    closeSheet();
    toast(isNew?"予定を入れました":"保存しました");
  };
  row.appendChild(save);
  body.appendChild(row);

  if(!isNew){
    var del=el("button","btn wide","この予定を削除");
    del.style.marginTop="12px"; del.style.color="var(--dye-1)";
    del.onclick=function(){ if(confirm("削除します。よろしいですか。")){ removePlan(p.id); closeSheet(); } };
    body.appendChild(del);
  }
  showSheet();
}

function openTripSheet(t){
  var isNew=!t||!t.id;
  var body=$("sheetBody"); body.innerHTML="";
  body.appendChild(sec(isNew?"出張をつくる":"出張"));

  var ni=inp("text",t&&t.name); ni.placeholder="例：10月 タイ・シンガポール出張";
  body.appendChild(fldWrap("名前",ni));
  var pi=inp("text",t&&t.place); pi.placeholder="例：バンコク／シンガポール";
  body.appendChild(fldWrap("行き先",pi));

  var s1=inp("date",t&&t.start_date), s2=inp("date",t&&t.end_date);
  var two=el("div","two");
  var w1=el("div"); w1.appendChild(el("label",null,"出発")); w1.appendChild(s1);
  var w2=el("div"); w2.appendChild(el("label",null,"帰着")); w2.appendChild(s2);
  two.appendChild(w1); two.appendChild(w2);
  var dw=el("div","fld"); dw.appendChild(el("label",null,"期間")); dw.appendChild(two);
  dw.appendChild(el("div","hint","期間を入れると、その日のマス目に色が付きます。"));
  body.appendChild(dw);

  var me=el("textarea"); me.rows=2; me.value=(t&&t.note)||"";
  body.appendChild(fldWrap("メモ",me));

  var row=el("div","btnrow"); row.style.margin="22px 0 6px";
  var save=el("button","btn pri",isNew?"つくる":"保存する");
  save.onclick=function(){
    var name=ni.value.trim();
    if(!name){ toast("名前を入れてください。"); return; }
    var b={ name:name, place:pi.value.trim()||null,
            start_date:s1.value||null, end_date:s2.value||null,
            note:me.value.trim()||null };
    if(b.start_date){
      var d=parseYmd(b.start_date);
      if(d){ S.calY=d.getFullYear(); S.calM=d.getMonth()+1; }
    }
    (isNew?createTrip(b):patchTrip(t.id,b));
    closeSheet();
    toast(isNew?"出張をつくりました":"保存しました");
  };
  row.appendChild(save);
  body.appendChild(row);

  if(!isNew){
    var del=el("button","btn wide","この出張を削除");
    del.style.marginTop="12px"; del.style.color="var(--dye-1)";
    del.onclick=function(){
      if(confirm("出張を削除します。ぶら下がっている予定は消えず、紐づけだけ外れます。よろしいですか。")){
        removeTrip(t.id); closeSheet();
      }
    };
    body.appendChild(del);
  }
  showSheet();
}

/* ---------- 起動 ---------- */
function showMain(){
  $("loginView").classList.add("hide");
  $("mainView").classList.remove("hide");
  $("addbar").classList.remove("hide");
  return loadAll().then(render).then(maybeRevive);
}
function showLogin(msg){
  $("mainView").classList.add("hide");
  $("addbar").classList.add("hide");
  $("loginView").classList.remove("hide");
  if(msg){ var e=$("li_err"); e.textContent=msg; e.classList.remove("hide"); }
}

$("li_go").onclick=function(){
  var m=$("li_mail").value.trim(), p=$("li_pass").value;
  if(!m||!p) return;
  $("li_go").disabled=true;
  signIn(m,p).then(function(r){
    $("li_go").disabled=false;
    if(r.ok&&r.j.access_token){ saveSess(r.j); showMain(); }
    else showLogin(r.j.error_description||r.j.msg||"ログインできませんでした。");
  });
};
$("li_pass").onkeydown=function(e){ if(e.key==="Enter") $("li_go").click(); };

/* 「> button」で直接の子だけを取る。仕事／私用の切り替えも .tabs の中にあるので、
   ここで拾ってしまうと S.tab が undefined になって画面が空になる */
Array.prototype.forEach.call(document.querySelectorAll(".tabs > button"),function(b){
  b.onclick=function(){ S.tab=b.dataset.tab; S.pick=null; render(); window.scrollTo(0,0); };
});

/* 仕事／私用の切り替え。選んだ状態は端末に覚えさせる（毎回選び直させない） */
Array.prototype.forEach.call(document.querySelectorAll(".areasw button"),function(b){
  b.onclick=function(){
    S.area=b.dataset.area;
    try{ localStorage.setItem("mytask.area",S.area); }catch(e){}
    applyArea(); S.pick=null; render(); window.scrollTo(0,0);
  };
});
try{
  var savedArea=localStorage.getItem("mytask.area");
  if(savedArea==="仕事"||savedArea==="私用"||savedArea==="all") S.area=savedArea;
}catch(e){}
try{
  var savedPM=localStorage.getItem("mytask.planMode");
  if(savedPM==="month"||savedPM==="list") S.planMode=savedPM;
}catch(e){}
$("scrim").onclick=closeSheet;
$("quickgo").onclick=function(){
  var v=$("quick").value.trim(); if(!v) return;
  $("quick").value="";
  /* 私用で絞り込んでいる最中に足したものは私用にする。
     仕事で作ると、追加した直後に画面から消えて「入らなかった」と誤解する */
  var ar=(S.area==="私用")?"私用":"仕事";
  create({title:v,project:"受信箱",priority:3,status:"open",area:ar});
  toast(ar==="私用"?"受信箱に追加しました（私用）":"受信箱に追加しました");
};
$("quick").onkeydown=function(e){ if(e.key==="Enter") $("quickgo").click(); };

(function boot(){
  loadSess();
  var h=location.hash;
  if(!S.sess&&h.indexOf("#k=")===0){
    var raw;
    try{ raw=decodeURIComponent(escape(atob(h.slice(3)))); }catch(e){ raw=null; }
    history.replaceState(null,"",location.pathname);
    if(raw){
      var p=raw.split(" ");
      return signIn(p[0],p[1]).then(function(r){
        if(r.ok&&r.j.access_token){ saveSess(r.j); return showMain(); }
        showLogin("自動ログインに失敗しました。手入力してください。");
      });
    }
  }
  if(S.sess){
    if(S.sess.expires_at&&S.sess.expires_at<Math.floor(Date.now()/1000)+60)
      return refresh().then(function(ok){ ok?showMain():showLogin(); });
    return showMain();
  }
  showLogin();
})();

})();
</script>
</body>
</html>
